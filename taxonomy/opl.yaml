# Open Protocol Library Taxonomy
# Mirrors commons.opencivics.co structure
# Version: 2.0
# Last Updated: 2026-02-01

name: Open Protocol Library
description: >
  A taxonomy for organizing open civic innovation patterns, protocols,
  playbooks, and related knowledge resources. Designed for collaborative
  knowledge commons that support communities taking direct action.

---

# RESOURCE TYPES
# Primary content categories from commons.opencivics.co

resource_types:

  # Core Resources (7 types)
  primitives:
    name: Primitives
    description: Fundamental building blocks and atomic concepts that form the basis of patterns and protocols
    directory: primitives/
    template: _templates/primitive.md
    icon: 🔹

  patterns:
    name: Patterns
    description: Recurring solutions to common civic challenges; conceptual foundations for protocols
    directory: patterns/
    template: _templates/pattern.md
    icon: 🔷

  protocols:
    name: Protocols
    description: Formal step-by-step processes with defined roles, interactions, and outcomes
    directory: protocols/
    template: _templates/protocol.md
    icon: 📋

  playbooks:
    name: Playbooks
    description: Actionable guides that integrate patterns and protocols for specific contexts
    directory: playbooks/
    template: _templates/playbook.md
    icon: 📖

  frameworks:
    name: Frameworks
    description: Comprehensive systems that organize multiple patterns, protocols, and concepts
    directory: frameworks/
    template: _templates/framework.md
    icon: 🏗️

  artifacts:
    name: Artifacts
    description: External resources (papers, books, tools, websites, podcasts) that inform the commons
    directory: artifacts/
    template: _templates/artifact.md
    icon: 📄

  templates:
    name: Templates
    description: Reusable structures and formats for creating new resources
    directory: templates/
    template: _templates/template.md
    icon: 📝

  # Directory Types (5 types)
  activities:
    name: Open Civic Activities
    description: Learning journeys, courses, workshops, and educational programs
    directory: activities/
    template: _templates/activity.md
    icon: 🎯

  systems:
    name: Open Civic Systems
    description: Interconnected sets of patterns, protocols, and tools that function as integrated wholes
    directory: systems/
    template: _templates/system.md
    icon: ⚙️

  utilities:
    name: Open Civic Utilities
    description: Tools, platforms, and infrastructure that support civic innovation
    directory: utilities/
    template: _templates/utility.md
    icon: 🔧

  individuals:
    name: Individuals
    description: People who contribute to, practice, or are referenced in the commons
    directory: people/
    template: _templates/person.md
    icon: 👤

  organizations:
    name: Organizations
    description: Groups, institutions, networks, and collectives in the civic innovation space
    directory: organizations/
    template: _templates/organization.md
    icon: 🏢

---

# CIVIC SECTORS
# 13 domains of civic life (from commons.opencivics.co "Browse by Civic Sector")

civic_sectors:

  - id: governance-political-systems
    name: Governance and Political Systems
    description: Reimagining decision-making and policy processes through participatory governance, distributed leadership, and adaptive institutions
    keywords: [governance, democracy, policy, voting, assembly, consensus, deliberation, political]

  - id: civic-engagement-participation
    name: Civic Engagement and Participation Systems
    description: Enabling meaningful participation, deliberation, and collective action in public life through open assemblies, dialogue, and self-governance
    keywords: [participation, engagement, deliberation, assembly, public, community, activism]

  - id: justice-legal-systems
    name: Justice and Legal Systems
    description: Ensuring fairness, accountability, and reconciliation through restorative, transparent, and community-anchored practices of justice
    keywords: [justice, legal, restorative, accountability, rights, law, courts]

  - id: educational-learning-systems
    name: Educational and Learning Systems
    description: Cultivating lifelong learning, open knowledge, and civic literacy through participatory education and shared inquiry
    keywords: [education, learning, knowledge, literacy, pedagogy, curriculum, training]

  - id: environmental-sustainability
    name: Environmental and Sustainability Systems
    description: Regenerating ecosystems and fostering balance between human activity and the natural world through stewardship, biodiversity, and circular design
    keywords: [environment, sustainability, ecology, climate, regeneration, biodiversity, stewardship]

  - id: economic-resource-sharing
    name: Economic and Resource Sharing Systems
    description: Building inclusive and regenerative economies rooted in cooperation, mutual aid, and stewardship of shared wealth and resources
    keywords: [economy, resources, sharing, cooperative, mutual-aid, commons, allocation]

  - id: health-wellbeing
    name: Health and Well-Being Systems
    description: Supporting physical, mental, and social health through integrated, community-based, and holistic approaches to care and well-being
    keywords: [health, wellbeing, care, mental-health, wellness, healing, community-care]

  - id: transportation-mobility
    name: Transportation and Mobility Systems
    description: Designing equitable, sustainable, and connected ways for people, goods, and ideas to move through places and networks
    keywords: [transportation, mobility, transit, movement, infrastructure, access]

  - id: cultural-creative
    name: Cultural and Creative Systems
    description: Nurturing art, storytelling, ritual, and shared meaning-making as foundations for belonging, imagination, and cultural continuity
    keywords: [culture, creativity, art, storytelling, ritual, meaning, belonging]

  - id: security-safety
    name: Security and Safety Systems
    description: Designing systems of care, preparedness, and protection that cultivate trust, resilience, and mutual responsibility across communities
    keywords: [security, safety, protection, resilience, preparedness, trust]

  - id: digital-technological
    name: Digital and Technological Systems
    description: Developing and integrating digital tools, infrastructures, and innovations that serve collective well-being and ethical, transparent participation in society
    keywords: [digital, technology, tools, infrastructure, innovation, platforms]

  - id: information-media
    name: Information and Media Systems
    description: Creating open, trustworthy, and participatory channels for communication, journalism, and collective sensemaking
    keywords: [information, media, journalism, communication, sensemaking, news]

  - id: housing-shelter
    name: Housing and Shelter Systems
    description: Ensuring access to safe, affordable, and dignified housing through community land trusts, cooperative models, and equitable development
    keywords: [housing, shelter, land, development, affordable, community-land-trust]

---

# CIVIC SCALES
# 7 levels of scope and impact

civic_scales:

  - id: individual
    name: Individual
    description: Personal practice, agency, and transformation
    scope: Single person

  - id: household
    name: Household
    description: Family, immediate living unit, and domestic sphere
    scope: 2-10 people

  - id: neighborhood
    name: Neighborhood
    description: Local community, block, village, or immediate locality
    scope: 10-1000 people

  - id: municipal
    name: Municipal
    description: City, town, or local government jurisdiction
    scope: 1000-1M people

  - id: bioregional
    name: Bioregional
    description: Watershed, ecosystem, or natural geographic boundary
    scope: Natural boundaries

  - id: national
    name: National
    description: Country, nation-state, or sovereign territory
    scope: 1M-1B people

  - id: planetary
    name: Planetary
    description: Global, species-wide, or Earth-system scope
    scope: All humanity

---

# SOCIAL ORGANISM FUNCTIONS
# Capacities that communities need to function well

social_organism_functions:

  - id: sensing
    name: Sensing
    description: Perceiving information from the environment and internal state

  - id: sensemaking
    name: Sensemaking
    description: Interpreting information to create shared meaning and understanding

  - id: mapping
    name: Mapping
    description: Visualizing relationships, dynamics, and territories

  - id: decision-making
    name: Decision-Making
    description: Evaluating options and selecting courses of action

  - id: allocating
    name: Allocating
    description: Distributing resources, roles, and responsibilities

  - id: coordinating
    name: Coordinating
    description: Synchronizing activities across actors and time

  - id: learning
    name: Learning
    description: Acquiring insights and adapting based on experience

  - id: relating
    name: Relating
    description: Building and maintaining connections and trust

---

# INNOVATION DOMAINS
# Special focus areas within Open Civics

innovation_domains:

  - id: rights-of-nature
    name: Rights of Nature
    description: Legal and governance frameworks that recognize ecosystems as rights-bearing entities
    related_sectors: [environmental-sustainability, justice-legal-systems]

  - id: bioregional-coordination
    name: Bioregional Coordination
    description: Organizing human activity around natural watershed and ecosystem boundaries
    related_sectors: [environmental-sustainability, governance-political-systems]

  - id: open-protocols
    name: Open Protocols
    description: Transparent, forkable governance and coordination patterns
    related_sectors: [governance-political-systems, digital-technological]

---

# UTILITY TYPES
# Categories of tools and infrastructure

utility_types:

  - id: monitoring-evaluation
    name: Monitoring and Evaluation
    description: Tools for tracking progress, measuring impact, and assessing outcomes

  - id: real-time-sensing
    name: Real-time Sensing
    description: Platforms for continuous environmental or system monitoring

  - id: resource-asset-mapping
    name: Resource and Asset Mapping
    description: Tools for cataloging and visualizing community resources

  - id: system-mapping
    name: System Mapping
    description: Visualization tools for complex systems and relationships

  - id: collective-documentation
    name: Collective Documentation
    description: Collaborative platforms for shared knowledge capture

  - id: open-education
    name: Open Education
    description: Learning platforms and educational resources

  - id: pattern-libraries
    name: Pattern Libraries
    description: Collections of reusable design patterns

  - id: peer-learning
    name: Peer Learning
    description: Platforms facilitating learning between peers

  - id: bioregional-mapping
    name: Bioregional Mapping
    description: Geographic tools for watershed and ecosystem visualization

  - id: participatory-research
    name: Participatory Research
    description: Tools for community-engaged research processes

  - id: collective-narrative
    name: Collective Narrative
    description: Platforms for shared storytelling and meaning-making

  - id: common-pool-resource-management
    name: Common Pool Resource Management
    description: Tools for governing shared resources

  - id: supply-chain-coordination
    name: Supply Chain Coordination
    description: Platforms for managing material flows

  - id: mutual-credit
    name: Mutual Credit
    description: Alternative economic coordination tools

---

# RELATIONSHIP TYPES
# How entities can relate to each other (14+ types from commons.opencivics.co)

relationship_types:

  - id: related-patterns
    name: Related Patterns
    target_types: [patterns]

  - id: related-protocols
    name: Related Protocols
    target_types: [protocols]

  - id: related-playbooks
    name: Related Playbooks
    target_types: [playbooks]

  - id: related-primitives
    name: Related Primitives
    target_types: [primitives]

  - id: related-frameworks
    name: Related Frameworks
    target_types: [frameworks]

  - id: related-artifacts
    name: Related Artifacts
    target_types: [artifacts]

  - id: related-templates
    name: Related Templates
    target_types: [templates]

  - id: related-activities
    name: Related Activities
    target_types: [activities]

  - id: related-systems
    name: Related Systems
    target_types: [systems]

  - id: related-utilities
    name: Related Utilities
    target_types: [utilities]

  - id: related-individuals
    name: Related Individuals
    target_types: [individuals]

  - id: related-organizations
    name: Related Organizations
    target_types: [organizations]

  - id: related-innovation-domains
    name: Related Innovation Domains
    target_types: [innovation_domains]

  - id: related-sectors
    name: Related Sectors
    target_types: [civic_sectors]

---

# METADATA FIELDS
# Standard fields for all resource types

metadata_fields:

  # Identity
  - name: name
    type: title
    required: true

  - name: short_description
    type: text
    required: true
    max_length: 200

  - name: description
    type: rich_text
    required: false

  # Attribution
  - name: authors
    type: relation
    target: individuals
    multiple: true

  - name: editors
    type: relation
    target: individuals
    multiple: true

  - name: maintainers
    type: relation
    target: individuals
    multiple: true

  # Classification
  - name: civic_sectors
    type: relation
    target: civic_sectors
    multiple: true

  - name: civic_scales
    type: relation
    target: civic_scales
    multiple: true

  - name: social_organism_functions
    type: relation
    target: social_organism_functions
    multiple: true

  - name: innovation_domains
    type: relation
    target: innovation_domains
    multiple: true

  # Status
  - name: moderated
    type: checkbox
    description: Has this been reviewed by a maintainer?

  - name: status
    type: select
    options: [draft, review, published, archived]

  # Timestamps
  - name: created
    type: date
    auto: true

  - name: updated
    type: date
    auto: true

---

# NOTION MAPPING
# How taxonomy maps to Notion database properties for reconciliation

notion_mapping:
  database_id_field: notion_id

  property_mapping:
    name: Name
    short_description: Short Description
    description: Description
    authors: Author(s)
    editors: Editor(s)
    maintainers: Maintainer(s)
    civic_sectors: Related Sectors
    moderated: Moderated

  relation_databases:
    patterns: Patterns
    protocols: Protocols
    playbooks: Playbooks
    primitives: Primitives
    frameworks: Frameworks
    artifacts: Artifacts
    activities: Open Civic Activities
    systems: Open Civic Systems
    utilities: Open Civic Utilities
    individuals: Individuals
    organizations: Organizations
