# OPAL Configuration
# Generated by setup wizard - customize as needed

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Mode Configuration
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

mode: commons  # personal | team | commons

# Personal mode: local-first, optional GitHub backup
# Team mode: GitHub for collaboration, shared Notion
# Commons mode: GitHub source of truth, democratic governance

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Repository Settings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

repository:
  name: open-protocol-library
  owner: omniharmonic
  default_branch: main
  remote: origin

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Taxonomy
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

taxonomy:
  # Primary taxonomy for the commons
  primary: opl

  # Available taxonomies
  taxonomies:
    opl:
      name: Open Protocol Library
      file: taxonomy/opl.yaml
      enabled: true

    activity-index:
      name: Activity Index
      file: taxonomy/activity-index.yaml
      enabled: true
      description: |
        Civic activities schema for grants, initiatives,
        gatherings, courses, alliances, maps, and resources.

    # Custom taxonomies can be added here
    # custom:
    #   name: My Custom Taxonomy
    #   file: taxonomy/custom.yaml
    #   enabled: false

  # Classification behavior
  classification:
    # Allow entities to be classified under multiple taxonomies
    allow_multi_taxonomy: true

    # Minimum confidence to consider a taxonomy match
    min_confidence: 0.7

    # When multi-taxonomy is enabled, create cross-references
    create_cross_references: true

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Processing Settings
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

processing:
  # Auto-processing
  auto_classify: true
  auto_preprocess: true

  # Requires human review
  auto_extract: true
  auto_reconcile: true
  auto_stage: true

  # Never auto (requires review or explicit command)
  auto_commit: false
  auto_merge: false  # Handled by governance rules

  # Quality thresholds
  min_extraction_confidence: 0.6
  min_reconcile_confidence: 0.7

  # Batch settings
  max_batch_size: 10
  processing_timeout_minutes: 30

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Entity Index
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

entity_index:
  path: _index/entities.json
  aliases_path: _index/aliases.json
  relationships_path: _index/relationships.json
  sync_state_path: _index/sync-state.json
  pipeline_state_path: _index/pipeline-state.json

  # Deduplication settings
  fuzzy_match_threshold: 3  # Max Levenshtein distance
  fuzzy_min_length: 8       # Min name length for fuzzy
  semantic_match_threshold: 0.7  # Claude semantic confidence

  # Auto-merge settings
  auto_merge_threshold: 0.9
  review_merge_threshold: 0.7

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Directories
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

directories:
  inbox: _inbox
  staging: _staging
  index: _index
  federation: _federation
  templates: _templates

  # Failed items go here for manual review
  failed: _inbox/failed

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Notifications
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

notifications:
  enabled: true

  # Notify on these events
  on_new_pr: true
  on_pr_ready: true
  on_merge: true
  on_processing_complete: true
  on_error: true

  # Channels (configured in integrations.yaml)
  channels:
    - email
    - telegram

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Logging
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

logging:
  level: info  # debug | info | warn | error
  file: .opal/logs/opal.log
  max_size_mb: 10
  keep_days: 30

  # Log these events
  log_extractions: true
  log_reconciliations: true
  log_commits: true
  log_api_calls: false  # Verbose, enable for debugging
